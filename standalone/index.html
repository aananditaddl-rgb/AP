<style>
html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: one phone-width column, cards stacked, fixed bottom tab bar. */
:root{
  --bg:#fff8f2;--surface:#fff;--surface-2:#fdf1e7;--ink:#2a1f17;--ink-2:#6f5f53;--ink-3:#a3938a;--line:#f1e3d6;

  --special:#2479bd;--special-soft:#e0f0fc;--chart:#e5512f;--chart-track:#f6ebe2;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17120f;--surface:#221b16;--surface-2:#2b221c;--ink:#f8ede4;--ink-2:#c7b6a8;--ink-3:#8a7a6e;--line:#3a2f27;
  --brand:#ff7d5e;--brand-ink:#1b120d;--brand-soft:#4a2a20;--brand-strong:#ffa58c;
  --good:#4fd19f;--good-soft:#173a2c;--warn:#f0b850;--warn-soft:#3d2f14;--over:#a88bff;--over-soft:#2e2550;
  --special:#67b6f0;--special-soft:#17324a;--chart:#e86244;--chart-track:#2f2620;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120f;--surface:#221b16;--surface-2:#2b221c;--ink:#f8ede4;--ink-2:#c7b6a8;--ink-3:#8a7a6e;--line:#3a2f27;
  --brand:#ff7d5e;--brand-ink:#1b120d;--brand-soft:#4a2a20;--brand-strong:#ffa58c;
  --good:#4fd19f;--good-soft:#173a2c;--warn:#f0b850;--warn-soft:#3d2f14;--over:#a88bff;--over-soft:#2e2550;
  --special:#67b6f0;--special-soft:#17324a;--chart:#e86244;--chart-track:#2f2620;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}

p{margin:0}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.small{font-size:13px}.tiny{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}.between{justify-content:space-between}.wrapflex{flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.t-brand{color:var(--brand-strong)}.t-good{color:var(--good)}.t-over{color:var(--over)}.t-warn{color:var(--warn)}.t-special{color:var(--special)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{height:48px;border-radius:16px;padding:0 18px;font-weight:700;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
a.btn{color:var(--ink)}

.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-over{background:var(--over-soft);color:var(--over)}.p-plain{background:var(--surface-2);color:var(--ink-2)}.p-special{background:var(--special-soft);color:var(--special)}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-strong)}
.chip.sp[aria-pressed="true"]{border-color:var(--special);background:var(--special-soft);color:var(--special)}
input[type=text],input[type=date],input[type=time],select{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
.notice{border-radius:16px;padding:12px 14px;font-size:14px;font-weight:600}
.n-err{background:var(--brand-soft);color:var(--brand-strong)}.n-good{background:var(--good-soft);color:var(--good)}.n-info{background:var(--special-soft);color:var(--special)}
.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.a-peach{background:#ffd9c7}.a-mint{background:#c9f0de}.a-sky{background:#cfe7fb}.a-lilac{background:#e2d9ff}.a-lemon{background:#fff1b8}.a-rose{background:#ffd3e0}

.tabs button[aria-current="page"]{color:var(--brand-strong)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .h{font-size:11px;font-weight:800;color:var(--ink-3);padding-bottom:2px}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:700;position:relative;max-width:100%}
.d-clean{background:var(--good-soft);color:var(--good)}.d-cheat{background:var(--brand-soft);color:var(--brand-strong)}.d-none{border:1px dashed var(--line);color:var(--ink-2)}.d-future{color:var(--ink-3);opacity:.6}
.day small{font-size:10px;font-weight:800;line-height:1}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day[aria-pressed="true"]{outline:2px solid var(--brand);outline-offset:1px}
.day .sp{position:absolute;left:6px;right:6px;bottom:3px;height:3px;border-radius:3px;background:var(--special)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.cols{display:flex;align-items:flex-end;gap:2px;height:130px;border-bottom:1px solid var(--line)}
.cols>div{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.cols .c{width:100%;max-width:34px;background:var(--chart);border-radius:4px 4px 0 0}
.cols .dim{opacity:.45}
.cols .mk{position:absolute;left:4px;right:4px;height:2px;background:var(--ink);opacity:.7;border-radius:2px}
.cols .v{position:absolute;font-size:12px;font-weight:800}
.collabels{display:flex;gap:2px}.collabels div{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--ink-2)}
.hbar{height:10px;border-radius:99px;background:var(--chart-track)}.hbar i{display:block;height:100%;border-radius:99px;background:var(--chart)}
.recap{border-radius:28px;padding:22px;color:#fff;background:linear-gradient(135deg,#ff6f4f,#ff8a5c 55%,#ffb36b);display:flex;flex-direction:column;gap:14px}
.recap .big{font:800 64px/1 var(--display)}
.recap .tile{background:rgba(255,255,255,.2);border-radius:16px;padding:10px 12px}
.recap .tile b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.toggle{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-checked="true"]{background:var(--good)}.toggle[aria-checked="true"]::after{left:22px}
.list>*+*{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px}
.seg button{height:38px;border-radius:10px;font-weight:700;font-size:13px;color:var(--ink-2)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink)}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%;background:var(--surface)}
.opt[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt b{display:block}.opt span{display:block;font-size:12px;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:8px 0;text-align:right}td:first-child,th:first-child{text-align:left}tr+tr td{border-top:1px solid var(--line)}
th{font-size:12px;color:var(--ink-2);font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none;margin-top:8px}
.li{display:flex;gap:10px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap" id="app" aria-live="polite">
  <div class="card"><h2>Loading Treatly…</h2><p class="muted small">Getting your entries.</p></div>
</div>
<nav class="tabs" aria-label="Main"><ul id="tabs"></ul></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
"use strict";
// ================= Dates (local calendar dates as YYYY-MM-DD) =================
const DAY=864e5;
const toD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const fromD=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>fromD(new Date(toD(s).getTime()+n*DAY));
const daysBetween=(a,b)=>Math.round((toD(b)-toD(a))/DAY)+1;
const minD=(a,b)=>a<b?a:b, maxD=(a,b)=>a>b?a:b;
const wd=s=>(toD(s).getUTCDay()+6)%7;
const sow=s=>addDays(s,-wd(s)), eow=s=>addDays(sow(s),6);
const som=s=>s.slice(0,8)+"01";
const dim=s=>{const d=toD(s);return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()};
const eom=s=>s.slice(0,8)+String(dim(s)).padStart(2,"0");
const addMonths=(s,n)=>{const d=toD(s);const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1));const m=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d.getUTCDate(),m));return fromD(t)};
function* days(a,b){for(let d=a;d<=b;d=addDays(d,1))yield d}
const todayStr=()=>new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], WDL=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const monthName=s=>MONTHS[toD(s).getUTCMonth()];
const monthLabel=s=>`${monthName(s)} ${toD(s).getUTCFullYear()}`;
const med=s=>{const d=toD(s);return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()].slice(0,3)} ${d.getUTCFullYear()}`};
const shortD=s=>{const d=toD(s);return `${WD[wd(s)]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()].slice(0,3)}`};
const rel=(s,t)=>s===t?"today":s===addDays(t,-1)?"yesterday":`on ${shortD(s)}`;
const pl=(n,w,p=w+"s")=>`${n} ${n===1?w:p}`;

// ================= Goal & allowance engine (same rules as the full app) =================
// Allowances accrue per day: weekly a/7, monthly a/days-in-month, weekday plan schedule[weekday],
// fixed total a/period length. An active special occasion replaces the goal on its dates.
const FAR="9999-12-31";
const roundA=x=>Math.round(x+1e-9);
function effEnd(g){if(g.status==="cancelled")return addDays(g.start,-1);let e=g.end;if(g.status==="paused"&&g.pausedFrom){const p=addDays(g.pausedFrom,-1);e=e?minD(e,p):p}return e}
const covers=(g,d)=>g.status!=="cancelled"&&d>=g.start&&d<=(effEnd(g)??FAR);
function goalFor(goals,d){let b=null;for(const g of goals)if(covers(g,d)&&(!b||g.created>b.created))b=g;return b}
const excFor=(ex,d)=>ex.find(e=>e.status==="active"&&d>=e.start&&d<=e.end)||null;
const currentGoal=goals=>goals.find(g=>g.status==="active"||g.status==="paused")||null;
function rate(g,d){switch(g.type){case"daily":return g.allowance;case"weekly":return g.allowance/7;case"monthly":return g.allowance/dim(d);case"weekday":return(g.schedule||[])[wd(d)]||0;case"total":return g.allowance/daysBetween(g.start,g.end)}}
function dayAllowance(goals,ex,d){const e=excFor(ex,d);if(e)return e.rule==="per_day"?e.allowance:e.allowance/daysBetween(e.start,e.end);const g=goalFor(goals,d);return g?rate(g,d):null}
function sumAllowance(goals,ex,a,b){let t=0,c=0;for(const d of days(a,b)){const x=dayAllowance(goals,ex,d);if(x!==null){t+=x;c++}}return{allowance:roundA(t),covered:c}}
function mealsBetween(logs,a,b){let n=0;for(const[d,l]of Object.entries(logs))if(d>=a&&d<=b)n+=l.m;return n}
const pStatus=(u,a)=>u>a?"over":u===a&&a>0?"reached":"within";
function goalWindow(g,d){let s,e;switch(g.type){case"daily":s=e=d;break;case"weekly":case"weekday":s=sow(d);e=eow(d);break;case"monthly":s=som(d);e=eom(d);break;case"total":s=g.start;e=g.end}return{start:maxD(s,g.start),end:minD(e,effEnd(g)??FAR)}}
function windowLabel(g,w,t){const cur=t>=w.start&&t<=w.end;switch(g.type){case"daily":return cur?"Today":med(w.start);case"weekly":case"weekday":return cur?"This week":`Week of ${med(sow(w.start))}`;case"monthly":return`Your ${monthName(w.start)} goal`;case"total":return"Goal period"}}
function progress(label,w,allowance,used,t){return{label,start:w.start,end:w.end,allowance,used,remaining:Math.max(0,allowance-used),pct:allowance>0?Math.round(used/allowance*100):used>0?100:0,status:pStatus(used,allowance),daysLeft:t>w.end?0:daysBetween(maxD(t,w.start),w.end)}}
function windowProgress(g,goals,ex,logs,t){const w=goalWindow(g,t);return progress(windowLabel(g,w,t),w,sumAllowance(goals,ex,w.start,w.end).allowance,mealsBetween(logs,w.start,minD(w.end,t)),t)}
function periodProgress(g,goals,ex,logs,t){const e=effEnd(g);if(!e||e<g.start)return null;const w={start:g.start,end:e};return progress("Whole goal",w,sumAllowance(goals,ex,w.start,w.end).allowance,mealsBetween(logs,w.start,minD(e,t)),t)}
function phase(g,t){if(g.status!=="active")return g.status;if(g.start>t)return"scheduled";if(g.end&&g.end<t)return"completed";return"active"}
function describe(g){const m=pl(g.allowance,"cheat meal");switch(g.type){case"daily":return`Up to ${m} a day`;case"weekly":return`Up to ${m} a week`;case"monthly":return`Up to ${m} a month`;case"total":return`Up to ${m} in total`;case"weekday":{const ds=(g.schedule||[]).map((n,i)=>n>0?`${WD[i]} ${n}`:null).filter(Boolean);return ds.length?`Weekly plan: ${ds.join(", ")}`:"No cheat meals planned"}}}
const duration=g=>g.end?`${med(g.start)} – ${med(g.end)} (${pl(daysBetween(g.start,g.end),"day")})`:`From ${med(g.start)}, ongoing`;
const OCC=[["vacation","Vacation","🏖️"],["birthday","Birthday","🎂"],["wedding","Wedding","💍"],["festival","Festival","🪔"],["holiday","Holiday","🎄"],["celebration","Celebration","🎉"],["other","Special occasion","✨"]];
const occ=o=>OCC.find(x=>x[0]===o)||OCC[6];
const exTitle=e=>(e.label||"").trim()||occ(e.occasion)[1];
const exDesc=e=>`${med(e.start)} – ${med(e.end)} (${pl(daysBetween(e.start,e.end),"day")}): up to ${pl(e.allowance,"cheat meal")} ${e.rule==="per_day"?"a day":"in total"}`;

// ================= Stats & monthly report =================
function summarize(logs,a,b,t){const last=minD(b,t);const s={elapsed:last>=a?daysBetween(a,last):0,logged:0,notLogged:0,cheatDays:0,clean:0,meals:0,rate:0,cats:{},wdMeals:[0,0,0,0,0,0,0],longestClean:0};let run=0;
  if(!s.elapsed)return s;for(const d of days(a,last)){const l=logs[d];if(!l){s.notLogged++;run=0;continue}s.logged++;if(l.h){s.cheatDays++;s.meals+=l.m;s.wdMeals[wd(d)]+=l.m;for(const c of l.c)s.cats[c]=(s.cats[c]||0)+1;run=0}else{s.clean++;run++;s.longestClean=Math.max(s.longestClean,run)}}
  s.rate=Math.round(s.logged/s.elapsed*100);return s}
function streak(logs,t){let d=logs[t]?t:addDays(t,-1),n=0;while(logs[d]){n++;d=addDays(d,-1)}return n}
function bestStreak(logs){let best=0,run=0,prev=null;for(const d of Object.keys(logs).sort()){run=prev&&addDays(prev,1)===d?run+1:1;best=Math.max(best,run);prev=d}return best}
const rankCats=c=>Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
function goalPerf(logs,goals,ex,a,b,t){const{allowance,covered}=sumAllowance(goals,ex,a,b);if(!covered)return null;let used=0;for(const[d,l]of Object.entries(logs))if(d>=a&&d<=minD(b,t)&&dayAllowance(goals,ex,d)!==null)used+=l.m;
  return{allowance,used,remaining:Math.max(0,allowance-used),status:pStatus(used,allowance),exceptions:ex.filter(e=>e.status==="active"&&e.start<=b&&e.end>=a)}}

// ================= Log flow (shared by Home and Calendar) =================
function flowFor(date){if(!ui.flow||ui.flow.date!==date){const l=S.logs[date];ui.flow={date,mode:l?"summary":"ask",meals:l&&l.h?l.m:1,cats:l?[...l.c]:[],note:l?l.n||"":"",err:null,saved:false,confirmDel:false}}return ui.flow}
function logFlow(date){
  const t=todayStr(),f=flowFor(date),l=S.logs[date],dw=rel(date,t);
  if(f.mode==="summary"&&l){return `<div style="display:flex;flex-direction:column;gap:12px">${l.h?`<div class="row" style="align-items:flex-start"><span class="avatar" style="width:48px;height:48px;border-radius:16px;background:var(--brand-soft);font-size:24px">${cat(l.c[0])[2]}</span><div style="min-width:0"><p style="font:800 18px var(--display)">${pl(l.m,"cheat meal")} ${dw}</p><p class="small muted">${l.c.map(catLabel).join(" · ")}</p>${l.n?`<p class="small muted"><i>“${esc(l.n)}”</i></p>`:""}${f.saved?`<p class="small t-good" style="font-weight:700;margin-top:4px">Logged. Every entry helps you see the bigger picture.</p>`:""}</div></div>`
    :`<div class="row"><span class="avatar" style="width:48px;height:48px;border-radius:16px;background:var(--good-soft);font-size:24px">🥗</span><div><p style="font:800 18px var(--display)">No cheat meals ${dw}</p><p class="small t-good" style="font-weight:700">Logged! You're staying on track.</p></div></div>`}
    ${f.confirmDel?`<div class="row" style="background:var(--surface-2);border-radius:14px;padding:10px"><p class="small" style="flex:1">Delete this entry? The day will show as not logged.</p><button class="btn sm" data-a="del-no">Keep</button><button class="btn sm primary" data-a="del-yes">Delete</button></div>`
    :`<div class="row"><button class="btn" style="flex:1" data-a="edit">Edit entry</button><button class="btn sm" data-a="del">Delete</button></div>`}</div>`}
  if(f.mode==="details"){return `<div style="display:flex;flex-direction:column;gap:16px"><div class="row between"><p style="font-weight:700">Tell us a little more</p><button class="link" data-a="back">Back</button></div>
    <div><p class="small" style="font-weight:700;margin-bottom:6px" id="mq">How many cheat meals did you have ${dw}?</p><div class="stepper" role="group" aria-labelledby="mq"><button data-a="m-" aria-label="One fewer meal" ${f.meals<=1?"disabled":""}>−</button><output>${f.meals}</output><button data-a="m+" aria-label="One more meal" ${f.meals>=20?"disabled":""}>+</button></div></div>
    <fieldset style="border:0;padding:0;margin:0"><legend class="small" style="font-weight:700;margin-bottom:6px">What did you eat? <span class="muted" style="font-weight:500">Pick all that apply</span></legend><div class="chips">${CATS.map(c=>`<button class="chip" data-a="cat" data-k="${c[0]}" aria-pressed="${f.cats.includes(c[0])}">${c[2]} ${c[1]}</button>`).join("")}</div></fieldset>
    <label class="f">Anything to add? (optional)<input type="text" id="note-in" maxlength="280" placeholder="e.g. Pizza and ice cream" value="${esc(f.note)}"></label>
    ${f.err?`<p class="notice n-err">${esc(f.err)}</p>`:""}
    <button class="btn primary wide" data-a="save-yes">Save ${pl(f.meals,"cheat meal")}</button>
    ${l&&l.h?`<button class="link" style="text-align:center" data-a="save-no">Actually, I didn't have any</button>`:""}</div>`}
  return `<div style="display:flex;flex-direction:column;gap:14px"><p class="q">Did you eat any junk food or have a cheat meal ${dw}?</p><div class="yesno"><button class="yes" data-a="yes">YES<small>I had a treat</small></button><button class="no" data-a="save-no">NO<small>${date===t?"Nothing today":"Nothing that day"}</small></button></div>${l?`<button class="link" style="text-align:center" data-a="cancel">Cancel</button>`:""}</div>`}

function saveLog(date,h){
  const f=flowFor(date),t=todayStr();
  if(date>t)return;
  if(h&&!f.cats.length){f.err="Pick at least one food category.";return render()}
  S.logs[date]=h?{h:true,m:f.meals,c:[...f.cats],n:(f.note||"").trim().slice(0,280)||null}:{h:false,m:0,c:[],n:null};
  if(date===t)post("logged","logged today's food intake",`logged:${t}`);
  const sk=streak(S.logs,t),ms=[365,180,100,60,30,14,7].find(m=>sk>=m);
  if(ms)post("streak",`completed a ${ms}-day tracking streak`,`streak:${ms}:${addDays(S.logs[t]?t:addDays(t,-1),-(sk-1))}`);
  f.mode="summary";f.saved=true;f.err=null;save();render()}

    const lab=`${med(d)}: ${fut?"upcoming":!l?"not logged":l.h?pl(l.m,"cheat meal"):"no cheat meals"}${e?", "+exTitle(e):""}`;
    cells.push(`<button class="day d-${st}${d===t?" today":""}" data-a="cal-day" data-d="${d}" aria-label="${esc(lab)}" aria-pressed="${ui.calSel===d}" ${fut?"disabled":""}>${Number(d.slice(8))}${st==="cheat"?`<small>×${l.m}</small>`:st==="clean"?"<small>✓</small>":""}${e?'<span class="sp"></span>':""}</button>`)}

function screenGoals(){

  </section>

   ${up.length?up.map(e=>`<div style="border:1px solid var(--line);background:var(--special-soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px"><div class="row between"><b>${occ(e.occasion)[2]} ${esc(exTitle(e))}</b><span class="tiny t-special" style="font-weight:700">${e.start<=t?"Happening now":"Upcoming"}</span></div><p class="small muted">${exDesc(e)}</p>
     ${ui.exEdit===e.id?`<div class="grid2"><label class="f">Starts<input type="date" id="xe-start" value="${e.start}" ${e.start<=t?"disabled":""}></label><label class="f">Ends<input type="date" id="xe-end" value="${e.end}" min="${e.start<=t?addDays(t,-1):e.start}"></label></div><div class="row"><button class="btn sm" data-a="xe-cancel">Cancel</button><button class="btn sm primary" data-a="xe-save" data-id="${e.id}">Save dates</button></div>`
     :`<div class="row"><button class="btn sm" data-a="xe-edit" data-id="${e.id}">${e.start<=t?"Extend or shorten":"Change dates"}</button><button class="btn sm" data-a="xe-end" data-id="${e.id}">${e.start<=t?"End early":"Cancel"}</button></div>`}</div>`).join(""):`<p class="small muted" style="background:var(--surface-2);border-radius:14px;padding:12px">Nothing planned right now.</p>`}</section>
  ${hist.length||past.length?`<section class="card"><h2>History</h2><div class="list">${hist.map(x=>{const e=effEnd(x),ok=x.status!=="cancelled"&&!(e&&e<x.start)&&x.start<=t;let res="";if(ok){const end=e??t;let tot=0;for(const d of days(x.start,end)){if(goalFor(S.goals,d)!==x)continue;tot+=dayAllowance(S.goals,S.exceptions,d)??0}const a=roundA(tot),s2=summarize(S.logs,x.start,minD(end,t),t);res=`<div class="row between"><p class="small muted">${s2.meals} of ${a} cheat meals used · logged ${s2.logged} of ${s2.elapsed} days</p>${pill(pStatus(s2.meals,a))}</div>`}

   <p class="small muted">Add the reminder to your phone's calendar and you'll get a notification every day at this time, with a link back here. If you open Treatly after this time without logging, you'll also see a reminder on Home.</p>
   <div class="grid2"><button class="btn" data-a="ics">📅 Phone calendar</button><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(googleCalUrl())}">Google Calendar</a></div>
   <p class="tiny faint">Changed the time? Remove the old calendar event and add it again.${net.mode==="cloud"?" Friends can also nudge you from their Friends tab.":""}</p></section>
  <section class="card"><h2>What friends can see</h2><p class="tiny muted">Only friends you accept can see these, and only what you switch on.</p>
   <div class="row between"><span><b class="small" style="display:block">Private profile</b><span class="tiny muted">Hide me from friends completely</span></span><button class="toggle" role="switch" aria-checked="${p.private}" aria-label="Private profile" data-a="priv-all"></button></div>
   ${PRIV.map(([k,l,h])=>`<div class="row between" style="border-top:1px solid var(--line);padding-top:10px"><span><b class="small" style="display:block">${l}</b>${h?`<span class="tiny muted">${h}</span>`:""}</span><button class="toggle" role="switch" aria-checked="${S.privacy[k]}" aria-label="${l}" data-a="priv" data-k="${k}" ${p.private?"disabled":""}></button></div>`).join("")}</section>
  <section class="card"><h2>${IN_CLAUDE?"About this version":"Your data"}</h2><p class="small muted">${net.mode==="cloud"?"Your entries are saved to your account and on this phone. Only friends you accept see what you allow above.":"Your entries are saved privately on this device, in this browser. Nobody else can see them. Keep a backup so you never lose them."}</p>${net.mode==="db"?"":`<div class="grid2"><button class="btn" data-a="export">Save a backup</button><label class="btn" style="cursor:pointer">Restore backup<input type="file" id="import-file" accept="application/json,.json" hidden></label></div>`}</section>`}

// ================= Shell, routing, events =================
const TABS=[["home","Home",'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'],["calendar","Calendar",'<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>'],["friends","Friends",'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.4 3.5 5.2"/>'],["insights","Insights",'<path d="M4 20V11M10 20V5M16 20v-7M22 20H2"/>'],["profile","Profile",'<circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/>']];
function render(){
  if(!net.loaded)return;
  const active=ui.tab==="goals"?"profile":ui.tab;
  document.getElementById("tabs").innerHTML=TABS.map(([k,l,i])=>`<li><button data-a="tab" data-t="${k}" ${active===k?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${i}</svg>${l}</button></li>`).join("");
  const scr={home:screenHome,calendar:screenCalendar,friends:screenFriends,insights:screenInsights,profile:screenProfile,goals:screenGoals}[ui.tab];
  const app=document.getElementById("app"),focusId=document.activeElement&&document.activeElement.id,sel=focusId?[document.activeElement.selectionStart,document.activeElement.selectionEnd]:null;
  document.querySelector(".tabs").hidden=!!ui.auth;
  app.innerHTML=ui.auth?screenAuth():scr();
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{if(sel&&el.setSelectionRange)el.setSelectionRange(sel[0],sel[1])}catch{}}}}

function newGoalForm(edit){const t=todayStr(),g=edit?currentGoal(S.goals):null;
  ui.goalForm=g?{editing:true,started:g.start<t,type:g.type,allowance:g.allowance,schedule:g.schedule?[...g.schedule]:[0,0,0,0,1,2,1],start:g.start,preset:g.end?"custom":"ongoing",customEnd:g.end||addDays(t,44),err:null}
  :{editing:false,type:"monthly",allowance:4,schedule:[0,0,0,0,1,2,1],start:t,preset:"ongoing",customEnd:addDays(t,44),err:null}}
function closePatch(g,last){if(g.status==="paused"&&g.pausedFrom)last=minD(last,addDays(g.pausedFrom,-1));const e=g.end?minD(g.end,last):last;if(e<g.start){g.status="cancelled";g.pausedFrom=null}else{g.status="ended";g.end=e;g.pausedFrom=null}}
function saveGoal(){const f=ui.goalForm,t=todayStr(),pre=f.type==="total"&&f.preset==="ongoing"?"30":f.preset,end=goalEnd(pre,f.start,f.customEnd);
  const allowance=f.type==="weekday"?f.schedule.reduce((a,b)=>a+b,0):f.allowance;
  if(end&&end<f.start){f.err="The end date must be after the start date.";return render()}
  const cur=currentGoal(S.goals),rule={type:f.type,allowance,schedule:f.type==="weekday"?[...f.schedule]:null};
  if(f.editing&&cur){
    const started=cur.start<t,changed=cur.type!==rule.type||cur.allowance!==rule.allowance||JSON.stringify(cur.schedule)!==JSON.stringify(rule.schedule);
    if(started&&end&&end<addDays(t,-1)){f.err="The end date can't be earlier than yesterday.";return render()}
    if(!changed||!started){Object.assign(cur,rule,{start:started?cur.start:f.start,end})}
    else{if(end&&end<t){f.err="To change the allowance, the goal needs to run until at least today.";return render()}
      const paused=cur.status==="paused";closePatch(cur,addDays(t,-1));S.goals.unshift({id:uid(),...rule,start:t,end,status:paused?"paused":"active",pausedFrom:paused?t:null,created:new Date().toISOString(),prev:cur.id})}
    post("goal","updated their goal: "+describe(rule).toLowerCase())}
  else{
    if(f.start<t){for(const d of days(f.start,addDays(t,-1)))if(S.goals.some(g=>covers(g,d))){f.err="That start date overlaps an earlier goal. Start from today instead.";return render()}}
    if(cur)closePatch(cur,addDays(f.start,-1));
    S.goals.unshift({id:uid(),...rule,start:f.start,end,status:"active",pausedFrom:null,created:new Date().toISOString(),prev:cur?cur.id:null});
    post("goal","started a new goal: "+describe(rule).toLowerCase())}
  ui.goalForm=null;save();flash("good","Saved! Your progress has been updated.")}
function saveExc(){const f=ui.excForm;if(f.end<f.start){f.err="The end date must be on or after the start date.";return render()}
  if(daysBetween(f.start,f.end)>366){f.err="Special occasions can last up to a year.";return render()}
  if(S.exceptions.some(e=>e.status==="active"&&e.start<=f.end&&e.end>=f.start)){f.err="These dates overlap another special occasion. Adjust or cancel that one first.";return render()}
  const g=currentGoal(S.goals),e={id:uid(),goalId:g?g.id:null,occasion:f.occasion,label:f.label.trim().slice(0,60)||null,start:f.start,end:f.end,rule:f.rule,allowance:f.allowance,status:"active"};
  S.exceptions.push(e);post("occasion",`adjusted their goal for ${exTitle(e)} (${med(e.start)} – ${med(e.end)})`);ui.excForm=null;save();flash("good","Special occasion saved.")}

document.addEventListener("input",ev=>{const id=ev.target.id,v=ev.target.value;
  if(id==="note-in"&&ui.flow)ui.flow.note=v;
  if(id==="x-label"&&ui.excForm)ui.excForm.label=v;});
document.addEventListener("change",ev=>{const id=ev.target.id,v=ev.target.value;if(!v)return;
  if(id==="import-file"){const file=ev.target.files[0];if(!file)return;file.text().then(txt=>{const d=JSON.parse(txt);if(!d||typeof d.logs!=="object"||!Array.isArray(d.goals))throw 0;S={...blankState(),...d};save();flash("good","Backup restored.")}).catch(()=>flash("err","That file isn't a Treatly backup."));return}
  if(id==="rem-time"&&/^\d\d:\d\d$/.test(v)){S.reminder={...(S.reminder||{}),time:v};save();render();return}
  if(id==="g-start"&&ui.goalForm){ui.goalForm.start=v;if(ui.goalForm.customEnd<v)ui.goalForm.customEnd=v;render()}
  if(id==="g-end"&&ui.goalForm){ui.goalForm.customEnd=v;render()}
  if(id==="x-start"&&ui.excForm){ui.excForm.start=v;if(ui.excForm.end<v)ui.excForm.end=v;render()}
  if(id==="x-end"&&ui.excForm){ui.excForm.end=v;render()}});
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,t=todayStr(),f=ui.flow;
  const date=ui.tab==="calendar"?ui.calSel:t;
  switch(a){
    case"tab":if(b.dataset.t==="friends"&&net.mode==="cloud")loadFriends();ui.tab=b.dataset.t;ui.goalForm=ui.excForm=null;ui.friendSel=null;ui.flow=null;window.scrollTo(0,0);break;
    case"yes":flowFor(date).mode="details";break;
    case"save-no":saveLog(date,false);return;
    case"save-yes":saveLog(date,true);return;
    case"back":f.mode=S.logs[date]?"summary":"ask";break;
    case"cancel":f.mode="summary";break;
    case"edit":f.saved=false;f.mode=S.logs[date].h?"details":"ask";break;
    case"del":f.confirmDel=true;break;case"del-no":f.confirmDel=false;break;
    case"del-yes":delete S.logs[date];ui.flow=null;save();break;
    case"m-":f.meals=Math.max(1,f.meals-1);break;case"m+":f.meals=Math.min(20,f.meals+1);break;
    case"cat":{const k=b.dataset.k;f.cats=f.cats.includes(k)?f.cats.filter(x=>x!==k):[...f.cats,k];f.err=null;break}
    case"goto-cal":ui.tab="calendar";ui.calSel=b.dataset.d;ui.calMonth=som(b.dataset.d);ui.flow=null;window.scrollTo(0,0);break;
    case"cal-day":ui.calSel=b.dataset.d;ui.flow=null;break;case"cal-close":ui.calSel=null;break;
    case"cal-prev":ui.calMonth=addMonths(ui.calMonth,-1);ui.calSel=null;break;case"cal-next":ui.calMonth=addMonths(ui.calMonth,1);ui.calSel=null;break;
    case"ins-prev":ui.insMonth=addMonths(ui.insMonth,-1);break;case"ins-next":ui.insMonth=addMonths(ui.insMonth,1);break;
    case"new-goal":ui.tab="goals";newGoalForm(false);window.scrollTo(0,0);break;
    case"edit-goal":newGoalForm(true);break;case"goal-cancel":ui.goalForm=null;break;
    case"g-type":{const g=ui.goalForm;g.type=b.dataset.v;g.allowance={monthly:4,weekly:2,daily:1,weekday:0,total:8}[g.type];break}
    case"g-al":ui.goalForm.allowance=Math.max(0,Math.min(500,ui.goalForm.allowance+Number(b.dataset.d)));break;
    case"g-sch":{const i=Number(b.dataset.i);ui.goalForm.schedule[i]=Math.max(0,Math.min(20,ui.goalForm.schedule[i]+Number(b.dataset.d)));break}
    case"g-pre":ui.goalForm.preset=b.dataset.v;break;
    case"goal-save":saveGoal();return;
    case"pause":{const g=currentGoal(S.goals);g.status="paused";g.pausedFrom=t;save();break}
    case"resume":{const g=currentGoal(S.goals);if(g.pausedFrom>=t){g.status="active";g.pausedFrom=null}else{const end=g.end;closePatch(g,t);if(!end||end>=t)S.goals.unshift({id:uid(),type:g.type,allowance:g.allowance,schedule:g.schedule,start:t,end,status:"active",pausedFrom:null,created:new Date().toISOString(),prev:g.id})}save();break}
    case"end-ask":ui.confirmEnd=true;break;case"end-no":ui.confirmEnd=false;break;
    case"end-yes":closePatch(currentGoal(S.goals),t);ui.confirmEnd=false;save();break;
    case"new-exc":ui.excForm={occasion:"vacation",label:"",start:t,end:addDays(t,4),rule:"total",allowance:5,err:null};break;
    case"exc-cancel":ui.excForm=null;break;
    case"x-occ":ui.excForm.occasion=b.dataset.v;break;case"x-rule":ui.excForm.rule=b.dataset.v;break;
    case"x-al":ui.excForm.allowance=Math.max(0,Math.min(200,ui.excForm.allowance+Number(b.dataset.d)));break;
    case"exc-save":saveExc();return;
    case"xe-edit":ui.exEdit=b.dataset.id;break;case"xe-cancel":ui.exEdit=null;break;
    case"xe-save":{const e=S.exceptions.find(x=>x.id===b.dataset.id),s=document.getElementById("xe-start").value,en=document.getElementById("xe-end").value;
      if(!s||!en||en<s){flash("err","The end date must be on or after the start date.");return}
      if(e.start<=t&&en<minD(e.end,addDays(t,-1))){flash("err","You can only shorten it to yesterday or later.");return}
      if(S.exceptions.some(x=>x!==e&&x.status==="active"&&x.start<=en&&x.end>=s)){flash("err","Those dates overlap another special occasion.");return}
      if(e.start>t)e.start=s;e.end=en;ui.exEdit=null;save();break}
    case"xe-end":{const e=S.exceptions.find(x=>x.id===b.dataset.id),y=addDays(t,-1);if(e.start>y)e.status="cancelled";else e.end=minD(e.end,y);save();break}
    case"edit-profile":ui.editProfile=!ui.editProfile;break;
    case"p-emoji":S.profile.emoji=b.dataset.v;break;case"p-color":S.profile.color=b.dataset.v;break;
    case"p-save":{const n=document.getElementById("p-name").value.trim().slice(0,40);S.profile.name=n;ui.editProfile=false;save();flash("good","Profile saved.");return}
    case"priv-all":S.profile.private=!S.profile.private;save();break;
    case"priv":S.privacy[b.dataset.k]=!S.privacy[b.dataset.k];save();break;
    case"friend":ui.friendSel=b.dataset.id;window.scrollTo(0,0);break;case"friend-close":ui.friendSel=null;break;
    case"cheer":toggleCheer(b.dataset.o,b.dataset.i);return;
    case"nudge":{const id=b.dataset.id,n=b.dataset.n;b.disabled=true;net.sb.from("nudges").insert({recipient_id:id,day:t}).then(({error})=>{
      if(error&&error.code!=="23505"){b.disabled=false;return flash("err","Couldn't send the nudge. Try again.")}
      net.nudgesOut=[...net.nudgesOut,id];flash("good",error?`You already nudged ${n} today.`:`Nudge sent! ${n} will see it next time they open Treatly.`)});return}
    case"inbox-clear":{ls.set("treatly-cheers-seen",new Date().toISOString());const ids=net.nudgesIn.map(n=>n.id);net.nudgesIn=[];render();
      if(ids.length)net.sb.from("nudges").update({seen_at:new Date().toISOString()}).in("id",ids).then(()=>{});return}
    case"ics":{const blob=new Blob([icsText()],{type:"text/calendar"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="treatly-daily-reminder.ics";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);flash("good","Open the downloaded file to add the daily reminder to your calendar.");return}
    case"show-signup":ui.auth="signup";ui.authErr=null;window.scrollTo(0,0);break;
    case"show-login":ui.auth="login";ui.authErr=null;window.scrollTo(0,0);break;
    case"skip-auth":ui.auth=null;ls.set("treatly-local-ok","1");break;
    case"do-signup":doAuth("signup");return;
    case"do-login":doAuth("login");return;
    case"logout":net.sb.auth.signOut().finally(()=>{ls.del("treatly-state");ls.set("treatly-show-login","1");location.reload()});return;
    case"find":{const q=document.getElementById("find-user").value.trim();if(!q)return;net.sb.rpc("find_user",{p_username:q}).then(({data})=>{ui.found=data&&data[0]?data[0]:{none:true};render()});return}
    case"add-friend":net.sb.rpc("send_friend_request",{p_target:b.dataset.id}).then(({data,error})=>{if(error)return flash("err","Couldn't send the request.");ui.found={...ui.found,relation:data};flash("good",data==="friend"?"You're now friends! 🎉":"Friend request sent.");loadFriends()});return;
    case"req-yes":case"req-no":net.sb.rpc("respond_friend_request",{p_request:b.dataset.id,p_accept:a==="req-yes"}).then(()=>loadFriends());return;
    case"unfriend-ask":ui.confirmUnfriend=true;break;case"unfriend-no":ui.confirmUnfriend=false;break;
    case"unfriend":net.sb.from("friendships").delete().eq("id",b.dataset.id).then(()=>{ui.friendSel=null;ui.confirmUnfriend=false;loadFriends()});return;
    case"share-app":{const url=inviteUrl();if(navigator.share){navigator.share({title:"Treatly",text:"Track your cheat meals with me on Treatly",url}).catch(()=>{})}else{navigator.clipboard&&navigator.clipboard.writeText(url).then(()=>flash("good","Link copied.")).catch(()=>flash("good",url))}return}
    case"export":{const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`treatly-backup-${t}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}
    case"share-recap":{const m=b.dataset.m,r=monthReport(m,S,t);post("recap",`shared their ${monthLabel(m)} recap: ${pl(r.s.meals,"cheat meal")} on ${pl(r.s.cheatDays,"day")}${r.goal?(r.goal.status==="over"?`, ${r.goal.used-r.goal.allowance} over allowance`:", within goal"):""}`,`recap:${m}:${r.s.meals}`);save();flash("good","Shared with your friends' activity feed.");return}
  }
  render()});
async function toggleCheer(owner,item){if(net.mode!=="cloud")return;const me=net.me.id,on=net.cheers.some(c=>c.owner_id===owner&&c.item_id===item&&c.user_id===me);
  net.cheers=on?net.cheers.filter(c=>!(c.owner_id===owner&&c.item_id===item&&c.user_id===me)):[...net.cheers,{user_id:me,owner_id:owner,item_id:item}];render();
  const r=on?await net.sb.from("cheers").delete().match({user_id:me,owner_id:owner,item_id:item}):await net.sb.from("cheers").insert({user_id:me,owner_id:owner,item_id:item});
  if(r.error)flash("err","Couldn't send your cheer.")}

init();
</script>
